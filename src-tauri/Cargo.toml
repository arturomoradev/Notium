[package]
name = "notium"
version = "0.1.3"
description = "Notium local-first Markdown note-taking app"
authors = ["Notium"]
edition = "2021"

[lib]
name = "notium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
ureq = { version = "2.10", features = ["json", "tls"] }
notium-core = { path = "../crates/notium-core" }
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-log = "2"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"
keyring = "4.2"

[dev-dependencies]
tempfile = "3"
